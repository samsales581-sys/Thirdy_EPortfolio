<script>
(function(){
    const savedTheme=localStorage.getItem("thirdy-portfolio-theme")||"dark";
    document.documentElement.setAttribute("data-theme",savedTheme);
    window.addEventListener("message",function(event){
        if(event.data&&event.data.type==="portfolio-theme"){
            const theme=event.data.theme==="light"?"light":"dark";
            document.documentElement.setAttribute("data-theme",theme);
            localStorage.setItem("thirdy-portfolio-theme",theme);
        }
    });
})();
</script>
